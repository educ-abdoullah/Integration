name: Deploy manuel SSH

on:
  workflow_dispatch:

jobs:
  deploy-manuel:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository GitHub
        uses: actions/checkout@v4

      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Préparer le dossier distant
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_IP" \
            "rm -rf ~/mra && mkdir -p ~/mra"

      - name: Copier les fichiers vers la machine distante
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -r test job.py \
            "$SSH_USER@$SSH_IP:~/mra/"

      - name: Lancer les tests sur la machine distante
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_IP" \
            "python3 ~/mra/test/test1.py -v"
