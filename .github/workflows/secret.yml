name: GitHub Actions Demo

on:
  workflow_dispatch:

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test secret
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}
        run: |
          echo "Le secret est accessible"
          python3 job.py
